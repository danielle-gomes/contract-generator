<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Geração de Contratos{% endblock %}</title>
  <style>
    :root { --conti-yellow:#FFA500; --ink:#1a1a1a; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,Segoe UI,sans-serif; background:#f4f5f7; color:var(--ink);
           margin:0; }

    /* ---------- header ---------- */
    .topbar { background:#fff; border-bottom:3px solid var(--conti-yellow);
              display:flex; align-items:center; justify-content:space-between;
              padding:14px 28px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
    .brand { display:flex; align-items:center; gap:14px; }
    .brand img { height:26px; display:block; }
    .divider { width:1px; height:22px; background:#ddd; }
    .app { font-weight:700; font-size:1rem; }
    .app em { font-style:normal; font-weight:400; color:#777; }
    .user { font-size:.88rem; color:#555; white-space:nowrap; }

    /* ---------- layout ---------- */
    .page { display:flex; justify-content:center; padding:40px 16px; }
    .card { background:#fff; border-radius:12px; padding:32px; width:100%;
            box-shadow:0 2px 16px rgba(0,0,0,.08); max-width:{% block cardwidth %}560px{% endblock %}; }
    h1 { margin:0 0 4px; font-size:1.5rem; }
    p.sub { margin:0 0 24px; color:#666; font-size:.9rem; }
    a.back { display:inline-block; margin-bottom:16px; font-size:.85rem; color:#666; }

    /* ---------- index ---------- */
    a.item { display:block; padding:16px; border:1px solid #e3e3e3; border-radius:8px;
             margin-bottom:10px; text-decoration:none; color:inherit; transition:.15s; }
    a.item:hover { border-color:var(--conti-yellow); background:#fffdf5; }
    .err { padding:16px; border-radius:8px; background:#fdeaea; color:#a11; margin-bottom:10px;
           font-size:.85rem; }

    /* ---------- form ---------- */
    label { display:block; font-weight:600; font-size:.85rem; margin-bottom:6px; }
    .hint { font-weight:400; color:#777; font-size:.78rem; display:block; margin-bottom:6px; }
    input[type=text],input[type=number],input[type=date],select,textarea {
      width:100%; padding:10px 12px; border:1px solid #d5d5d5; border-radius:6px;
      font-size:.95rem; font-family:inherit; margin-bottom:18px; }
    textarea { min-height:90px; resize:vertical; }
    .check { display:flex; gap:10px; align-items:flex-start; margin-bottom:18px; }
    .check input { margin-top:3px; }
    .check label { font-weight:400; }
    button { background:var(--conti-yellow); border:0; padding:13px 24px; border-radius:6px;
             font-weight:700; font-size:.95rem; cursor:pointer; width:100%; }

    @media (max-width:640px) {
      .topbar { flex-direction:column; align-items:flex-start; gap:8px; }
      .page { padding:24px 12px; }
      .card { padding:24px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/assets/continental.png" alt="Continental">
      <span class="divider"></span>
      <span class="app">Geração de Contratos <em>— Jurídico</em></span>
    </div>
    {% if user_name %}<div class="user">Olá, {{ user_name }}!</div>{% endif %}
  </header>

  <div class="page">
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
